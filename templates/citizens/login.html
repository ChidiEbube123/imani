{% extends 'base.html' %}
{% block title %}Login — GovTrust{% endblock %}
{% block content %}
<div style="max-width:400px;margin:4rem auto">
  <div style="text-align:center;margin-bottom:2rem">
    <div style="font-size:2.5rem;margin-bottom:.5rem">&#127963;</div>
    <h1 style="font-size:1.4rem;font-weight:700">Sign In</h1>
    <p class="text-muted">Monitor your government. Hold them accountable.</p>
  </div>
  <div class="card">
    <form method="post">{% csrf_token %}
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
      <div class="grid" style="gap:.9rem;margin-bottom:1.25rem">
        <div class="form-group"><label>Username</label><input name="username" class="form-control" required autofocus autocomplete="username"></div>
        <div class="form-group"><label>Password</label><input name="password" type="password" class="form-control" required autocomplete="current-password"></div>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">Sign In</button>
    </form>
    <div class="divider"></div>
    <div style="text-align:center;font-size:.85rem;color:var(--muted)">No account? <a href="{% url 'citizen_register' %}">Register free</a></div>
  </div>
  <div style="text-align:center;margin-top:1rem;font-size:.8rem;color:var(--muted)">
    Government admin? <a href="/admin/">Admin login &#8599;</a>
  </div>
</div>
{% endblock %}
