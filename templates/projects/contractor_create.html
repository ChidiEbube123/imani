{% extends 'base.html' %}
{% block title %}Register Contractor — GovTrust{% endblock %}
{% block content %}
<div class="page-header"><h1>Register Contractor</h1><p>Add a new contractor to the monitoring platform</p></div>
<div class="card" style="max-width:580px">
  <form method="post">{% csrf_token %}
    <div class="grid" style="gap:1rem;margin-bottom:1rem">
      <div class="form-group"><label>Full Name</label><input name="name" class="form-control" required placeholder="John Adeyemi"></div>
      <div class="form-group"><label>Company Name</label><input name="company" class="form-control" required placeholder="BuildRight Ltd"></div>
      <div class="form-group"><label>Email</label><input name="email" type="email" class="form-control" required></div>
      <div class="form-group"><label>Phone</label><input name="phone" class="form-control" required placeholder="+234..."></div>
      <div class="form-group"><label>Bank Account Number</label><input name="bank_account" class="form-control" required></div>
      <div class="form-group"><label>CAC Registration Number</label><input name="registration_number" class="form-control" required placeholder="RC-1234567"></div>
    </div>
    <div style="display:flex;gap:.75rem"><button type="submit" class="btn btn-primary">Register Contractor</button><a href="{% url 'contractor_list' %}" class="btn btn-secondary">Cancel</a></div>
  </form>
</div>
{% endblock %}
